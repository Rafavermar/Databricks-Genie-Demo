variables:
  catalog:
    description: Writable Unity Catalog catalog for the demo.
    default: workspace
  schema:
    description: Isolated schema owned by this demo.
    default: renewable_operations_demo
  warehouse_id:
    description: Required ID of an existing SQL warehouse used by AI/BI assets.
  seed:
    description: Fixed synthetic-data seed.
    default: "202603"

