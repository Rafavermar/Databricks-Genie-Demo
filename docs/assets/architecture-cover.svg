<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura de inteligencia operativa para energía renovable con Databricks Genie</title>
  <desc id="description">Flujo técnico reproducible desde datos sintéticos y GitHub hasta un job serverless, tablas Delta, Unity Catalog, dashboard, Genie Agent y Genie One.</desc>
