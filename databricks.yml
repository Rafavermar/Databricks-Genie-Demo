bundle:
  name: gg-renewable-operations-demo

include:
  - resources/*.yml

sync:
  exclude:
    - .venv
    - .git
    - evidence
    - presentation/*.pptx
    - presentation/rendered
    - tests

targets:
  dev:
    mode: development
    default: true
  enterprise:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
